<h2 id="desc" class="list">Ontología de Dispositivos Médicos (ODM): Description <span class="backlink"> back to <a href="#toc">ToC</a></span></h2>

<span class="markdown">La ODM es una ontología de dominio que representa información sobre dispositivos médicos que se comercializan en Europa.  Incluye información sobre dispositivos, fabricantes, riesgos, incidentes y correcciones de seguridad.</span>
